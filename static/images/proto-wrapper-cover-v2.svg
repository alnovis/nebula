<svg width="1200" height="630" viewBox="75 50 1050 580" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .bg { fill: #0f0f0f; }
    .text { fill: #e0e0e0; }
    .mono { font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace; }
    .title { font-size: 36px; font-weight: 600; letter-spacing: -0.02em; }
    .title2 { fill: #9a9a9a; }
    .subtitle { font-size: 16px; fill: #818cf8; font-weight: 500; letter-spacing: 0.08em; }
    .boxtext { font-size: 17px; font-weight: 500; }
    .sub { font-size: 13px; fill: #a8a8a8; }
    .line-v { stroke: #2a2a2a; stroke-width: 1; }
    .box { fill: #1a1a1a; stroke: #6366f1; stroke-width: 1.5; }
    .box-main { fill: #1a1a2e; stroke: #6366f1; stroke-width: 2; }
    .box-muted { fill: #1a1a1a; stroke: #3a3a3a; stroke-width: 1; }
    .arrow { stroke: #6366f1; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrow-muted { stroke: #6a6a6a; stroke-width: 1.5; fill: none; marker-end: url(#arrow-muted); }
    .conflict { fill: #f87171; font-size: 13px; font-weight: 600; }
    .footer { font-size: 13px; fill: #8a8a8a; }
  </style>

  <rect class="bg" width="1200" height="630"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6366f1"/>
    </marker>
    <marker id="arrow-muted" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6a6a6a"/>
    </marker>
  </defs>

  <!-- Left title block -->
  <text x="100" y="100" class="subtitle">PROTO WRAPPER</text>
  <text x="100" y="148" class="text title">How I Stopped Fighting</text>
  <text x="100" y="184" class="text title title2">Protobuf Versioning</text>
  <line x1="100" y1="210" x2="420" y2="210" class="line-v"/>

  <!-- Right title block -->
  <text x="1100" y="100" text-anchor="end" class="subtitle">VERSIONING</text>
  <text x="1100" y="148" text-anchor="end" class="text title">Multiple Versions</text>
  <text x="1100" y="184" text-anchor="end" class="text title title2">One Interface</text>
  <line x1="860" y1="210" x2="1100" y2="210" class="line-v"/>

  <!-- === Version boxes === -->

  <rect x="100" y="260" width="190" height="70" rx="6" class="box-muted"/>
  <text x="195" y="290" text-anchor="middle" class="text" style="font-size: 16px">v1</text>
  <text x="195" y="313" text-anchor="middle" class="sub mono">amount: int32</text>

  <rect x="100" y="345" width="190" height="70" rx="6" class="box-muted" style="stroke: #ef4444; stroke-width: 1.5"/>
  <text x="195" y="375" text-anchor="middle" class="text" style="font-size: 16px">v2</text>
  <text x="195" y="398" text-anchor="middle" class="sub mono">amount: int64</text>

  <rect x="100" y="430" width="190" height="70" rx="6" class="box-muted"/>
  <text x="195" y="460" text-anchor="middle" class="text" style="font-size: 16px">v3</text>
  <text x="195" y="483" text-anchor="middle" class="sub mono">amount: string</text>

  <text x="320" y="370" class="conflict">type conflict</text>

  <!-- Arrows converging -->
  <path d="M290,295 C380,295 380,360 456,360" class="arrow-muted"/>
  <line x1="290" y1="380" x2="456" y2="380" class="arrow"/>
  <path d="M290,465 C380,465 380,400 456,400" class="arrow-muted"/>

  <!-- Unified wrapper -->
  <rect x="460" y="315" width="300" height="130" rx="8" class="box-main"/>
  <text x="610" y="363" text-anchor="middle" class="text boxtext">Unified Wrapper</text>
  <text x="610" y="391" text-anchor="middle" class="sub mono">getAmount(): long</text>
  <text x="610" y="413" text-anchor="middle" class="sub mono">asVersion(ctx): Wrapper</text>

  <line x1="760" y1="380" x2="846" y2="380" class="arrow"/>

  <!-- Application code -->
  <rect x="850" y="325" width="250" height="110" rx="6" class="box"/>
  <text x="975" y="370" text-anchor="middle" class="text boxtext">Application Code</text>
  <text x="975" y="397" text-anchor="middle" class="sub">One code path, all versions</text>

  <!-- Footer -->
  <text x="100" y="610" class="footer">alnovis.io</text>
  <text x="1100" y="610" text-anchor="end" class="footer">Maven / Gradle / Protobuf</text>

</svg>
