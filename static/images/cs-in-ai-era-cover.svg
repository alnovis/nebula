<svg width="1200" height="630" viewBox="75 50 1050 580" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0f0f0f; }
    .text { fill: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .title { font-size: 36px; font-weight: 600; letter-spacing: -0.02em; }
    .subtitle { font-size: 16px; fill: #6366f1; font-weight: 400; letter-spacing: 0.08em; }
    .label { font-size: 13px; fill: #555; letter-spacing: 0.1em; text-transform: uppercase; }
    .boxsub { font-size: 12px; fill: #666; }
    .line-v { stroke: #222; stroke-width: 1; }
    .col-left { fill: #141414; stroke: #333; stroke-width: 1; rx: 6; }
    .col-right { fill: #1a1a1a; stroke: #6366f1; stroke-width: 1.5; rx: 6; }
    .tag { fill: #141414; stroke: #333; stroke-width: 1; rx: 4; }
  </style>

  <rect class="bg" width="1200" height="630"/>

  <!-- Left title block -->
  <text x="100" y="100" class="text subtitle">OPINION</text>
  <text x="100" y="148" class="text title">Do You Still Need</text>
  <text x="100" y="184" class="text title" style="fill: #888">Computer Science</text>
  <line x1="100" y1="210" x2="420" y2="210" class="line-v"/>

  <!-- Right title block -->
  <text x="1100" y="100" text-anchor="end" class="text subtitle">THE QUESTION</text>
  <text x="1100" y="148" text-anchor="end" class="text title">In the Age</text>
  <text x="1100" y="184" text-anchor="end" class="text title" style="fill: #888">of AI</text>
  <line x1="860" y1="210" x2="1100" y2="210" class="line-v"/>

  <!-- === Left column: AI === -->

  <text x="220" y="260" text-anchor="middle" class="label">AI generates</text>

  <rect x="100" y="278" width="240" height="195" class="col-left"/>

  <circle cx="130" cy="312" r="4" fill="#444"/>
  <text x="146" y="317" class="text" style="font-size: 14px; fill: #888">Code output</text>

  <circle cx="130" cy="345" r="4" fill="#444"/>
  <text x="146" y="350" class="text" style="font-size: 14px; fill: #888">Speed</text>

  <circle cx="130" cy="378" r="4" fill="#444"/>
  <text x="146" y="383" class="text" style="font-size: 14px; fill: #555">Boilerplate</text>

  <line x1="125" y1="410" x2="315" y2="410" style="stroke: #222; stroke-width: 1"/>
  <text x="220" y="443" text-anchor="middle" class="text" style="font-size: 28px; fill: #ef4444; font-weight: 600">1.7x</text>
  <text x="220" y="465" text-anchor="middle" class="boxsub">more bugs</text>

  <!-- === "vs" divider === -->

  <line x1="410" y1="278" x2="410" y2="473" style="stroke: #444; stroke-width: 1; stroke-dasharray: 4,4"/>
  <text x="410" y="380" text-anchor="middle" class="text" style="font-size: 15px; fill: #555">vs</text>

  <!-- === Right column: CS === -->

  <text x="600" y="260" text-anchor="middle" class="label">You understand</text>

  <rect x="480" y="278" width="240" height="195" class="col-right"/>

  <circle cx="510" cy="312" r="4" fill="#6366f1"/>
  <text x="526" y="317" class="text" style="font-size: 14px">Architecture</text>

  <circle cx="510" cy="345" r="4" fill="#6366f1"/>
  <text x="526" y="350" class="text" style="font-size: 14px">Trade-offs</text>

  <circle cx="510" cy="378" r="4" fill="#6366f1"/>
  <text x="526" y="383" class="text" style="font-size: 14px; fill: #6366f1">Verification</text>

  <line x1="505" y1="410" x2="695" y2="410" style="stroke: #333; stroke-width: 1"/>
  <text x="600" y="443" text-anchor="middle" class="text" style="font-size: 28px; fill: #6366f1; font-weight: 600">23.5%</text>
  <text x="600" y="465" text-anchor="middle" class="boxsub">fewer incidents</text>

  <!-- === Stat cards (right side, full width) === -->

  <text x="780" y="260" class="label">The numbers</text>

  <rect x="780" y="278" width="150" height="85" class="tag"/>
  <text x="855" y="320" text-anchor="middle" class="text" style="font-size: 28px; fill: #6366f1; font-weight: 600">41%</text>
  <text x="855" y="348" text-anchor="middle" class="text" style="font-size: 13px; fill: #666">code churn</text>

  <rect x="950" y="278" width="150" height="85" class="tag"/>
  <text x="1025" y="320" text-anchor="middle" class="text" style="font-size: 28px; fill: #6366f1; font-weight: 600">1.75x</text>
  <text x="1025" y="348" text-anchor="middle" class="text" style="font-size: 13px; fill: #666">logic errors</text>

  <rect x="780" y="383" width="150" height="85" class="tag"/>
  <text x="855" y="425" text-anchor="middle" class="text" style="font-size: 28px; fill: #6366f1; font-weight: 600">1.57x</text>
  <text x="855" y="453" text-anchor="middle" class="text" style="font-size: 13px; fill: #666">security issues</text>

  <rect x="950" y="383" width="150" height="85" class="tag"/>
  <text x="1025" y="425" text-anchor="middle" class="text" style="font-size: 28px; fill: #ef4444; font-weight: 600">+20%</text>
  <text x="1025" y="453" text-anchor="middle" class="text" style="font-size: 13px; fill: #666">PRs, more incidents</text>

  <!-- === CS vocabulary tags (wider) === -->

  <text x="100" y="520" class="label">CS as working vocabulary</text>

  <rect x="100" y="536" width="66" height="28" class="tag"/>
  <text x="133" y="554" text-anchor="middle" class="text" style="font-size: 12px; fill: #888">SOLID</text>

  <rect x="178" y="536" width="58" height="28" class="tag"/>
  <text x="207" y="554" text-anchor="middle" class="text" style="font-size: 12px; fill: #888">DDD</text>

  <rect x="248" y="536" width="56" height="28" class="tag"/>
  <text x="276" y="554" text-anchor="middle" class="text" style="font-size: 12px; fill: #888">CAP</text>

  <rect x="316" y="536" width="58" height="28" class="tag"/>
  <text x="345" y="554" text-anchor="middle" class="text" style="font-size: 12px; fill: #888">O(n)</text>

  <rect x="386" y="536" width="60" height="28" class="tag"/>
  <text x="416" y="554" text-anchor="middle" class="text" style="font-size: 12px; fill: #888">ACID</text>

  <rect x="458" y="536" width="64" height="28" class="tag"/>
  <text x="490" y="554" text-anchor="middle" class="text" style="font-size: 12px; fill: #888">CQRS</text>

  <rect x="534" y="536" width="52" height="28" class="tag"/>
  <text x="560" y="554" text-anchor="middle" class="text" style="font-size: 12px; fill: #888">IoC</text>

  <rect x="598" y="536" width="78" height="28" class="tag"/>
  <text x="637" y="554" text-anchor="middle" class="text" style="font-size: 12px; fill: #888">Pub/Sub</text>

  <rect x="688" y="536" width="66" height="28" class="tag"/>
  <text x="721" y="554" text-anchor="middle" class="text" style="font-size: 12px; fill: #888">BASE</text>

  <!-- Footer -->
  <text x="100" y="610" class="text" style="font-size: 13px; fill: #444">alnovis.io</text>
  <text x="1100" y="610" text-anchor="end" class="text" style="font-size: 13px; fill: #333">CS / AI / Architecture</text>

</svg>
