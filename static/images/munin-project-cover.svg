<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0b1010; }
    .text { fill: #dce1e1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .subtitle { font-size: 16px; fill: #2ab5a6; font-weight: 500; letter-spacing: 0.08em; }
  </style>

  <rect class="bg" width="1200" height="630"/>

  <!-- PROJECT label (right top) -->
  <text x="1100" y="80" text-anchor="end" class="text subtitle">PROJECT</text>

  <!-- MUNIN rotated -90deg -->
  <g transform="translate(250, 315) rotate(-90)">
    <text x="-195" y="0" text-anchor="start"
      style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
             font-size: 220px; font-weight: 800; letter-spacing: 0.06em; fill: #848989">
      M<tspan fill="#2ab5a6">U</tspan>
    </text>
    <text x="-195" y="210" text-anchor="start"
      style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
