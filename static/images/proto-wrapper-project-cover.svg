<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0f0f0f; }
    .text { fill: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .subtitle { font-size: 16px; fill: #6366f1; font-weight: 400; letter-spacing: 0.08em; }
  </style>

  <rect class="bg" width="1200" height="630"/>

  <!-- PROJECT label (right top) -->
  <text x="1100" y="80" text-anchor="end" class="text subtitle">PROJECT</text>

  <!-- VERSIONING horizontal, spanning same height as PRO/TO/BUF -->
  <text x="100" y="135"
    style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
           font-size: 42px; font-weight: 800; letter-spacing: 0.57em; fill: #888">
    VERSIONING
  </text>

  <!-- PRO / TO / BUF rotated -90deg, left-aligned -->
  <g transform="translate(220, 315) rotate(-90)">
    <text x="-245" y="0"
      style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
             font-size: 180px; font-weight: 800; letter-spacing: 0.04em; fill: #888">
      PR<tspan fill="#6366f1">O</tspan>
    </text>
    <text x="-245" y="175"
      style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
             font-size: 180px; font-weight: 800; letter-spacing: 0.04em; fill: #888">
      T<tspan fill="#6366f1">O</tspan>
    </text>
    <text x="-245" y="350"
      style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
             font-size: 180px; font-weight: 800; letter-spacing: 0.04em; fill: #888">
      <tspan fill="#e0e0e0">B</tspan>UF
    </text>
  </g>

  <!-- Cover/wrapper icon (right side, smaller) -->
  <g transform="translate(700, 140) scale(17)" opacity="0.35">
    <path fill="#6366f1" d="M170,4053 L178,4053 L178,4045 L170,4045 L170,4053 Z M182,4059 L184,4059 L184,4039 L182,4039 L182,4059 Z M164,4059 L166,4059 L166,4039 L164,4039 L164,4059 Z"
      transform="translate(-164, -4039)"/>
  </g>

  <!-- Stack under icon -->
  <text x="870" y="540" text-anchor="middle" class="text" style="font-size: 18px; fill: #555; letter-spacing: 0.12em">JAVA / KOTLIN / MVN / GRADLE</text>

  <!-- Footer -->
  <text x="100" y="610" class="text" style="font-size: 13px; fill: #444">alnovis.io</text>
  <text x="1100" y="610" text-anchor="end" class="text" style="font-size: 13px; fill: #333">github.com/alnovis/proto-wrapper-plugin</text>

</svg>
